services:
  postgres:
    image: postgres:16-alpine
    container_name: agentscope_postgres
    environment:
      POSTGRES_USER: agentscope
      POSTGRES_PASSWORD: agentscope
      POSTGRES_DB: agentscope
    ports:
      - "5432:5432"
    volumes:
      - agentscope_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentscope -d agentscope"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentscope_api
    environment:
      DATABASE_URL: postgresql+psycopg://agentscope:agentscope@postgres:5432/agentscope
      IA_PROVIDER: fake
      IA_MODEL: fake-local
      OPENROUTER_API_KEY: ""
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: agentscope_web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  agentscope_pgdata:

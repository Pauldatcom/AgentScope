services:
  postgres:
    image: postgres:16-alpine
    container_name: agentscope_postgres
    environment:
      POSTGRES_USER: agentscope
      POSTGRES_PASSWORD: agentscope
      POSTGRES_DB: agentscope
    ports:
      - "5432:5432"
    volumes:
      - agentscope_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentscope -d agentscope"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agentscope_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agentscope.local
      PGADMIN_DEFAULT_PASSWORD: agentscope
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  agentscope_pgdata:

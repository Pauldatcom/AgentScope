[project]
name = "agentscope"
version = "0.1.0"
description = "AgentScope — explore and normalize traces from coding AI agents (Claude Code, Codex, ...)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
authors = [{ name = "AgentScope Contributors" }]
keywords = ["ai", "agents", "traces", "dashboard", "llm"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
 "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/Pauldatcom/AgentScope"
Repository = "https://github.com/Pauldatcom/AgentScope"

[project.scripts]
agentscope = "agentscope.api.main:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
environments = ["sys_platform == 'darwin' or sys_platform == 'linux'"]

[tool.hatch.build.targets.wheel]
packages = ["agentscope"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["agentscope", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"agentscope/api/routers/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["web/"]

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["misc"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires external services (Postgres, network).",
    "e2e: end-to-end scenarios using the FakeAgent.",
]
filterwarnings = ["error::DeprecationWarning"]
